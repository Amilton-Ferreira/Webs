<!DOCTYPE html>
<HTML Lang= "pt"> 
<head>
     <meta charset="UTF-8">
     <meta http-equiv="X-UA-Compatible" content="IE=edge">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Shopee</title>
<link rel="stylesheet" href="style_css/shopee.css"/>
</head>
<body>
<header>
  <img src="images/Shopee_logo.svg.png" id="logo"/>
  <a href="#"style="color:red">Precisa de ajuda?</a>
</header> 

<!-- Tela de login -->
<main class="container">
  <form> 
    <h1>Entre</h1>
    <div class="input-box">
      <input type="text" placeholder="Número de telefone/Nome do usuário/Email">
      <input type="password" placeholder="Senha">
    </div>
    <button type="submit" class="login-btn">Entre</button>
    <div class="remember-forgot">
      <a href="#">Esqueci minha senha</a>
      <a href="#">Fazer login com SMS</a>
    </div>
    <div class="social-links">
      
    </div>
    <div class="register-link">
      <p style="color:#dbdbdb">Novo na Shopee? <a href="#"><span style="color:#F6642F">Cadastrar</span></a></p>
    </div>
  </form>
  </main>
</body>
</html>
